name: One-time localization disclosure formatter

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: localization-final-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'hardening/auth-and-release-gates-2026-11-22'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and update translation index
        run: |
          pnpm exec prettier --write src/features/settings/AccessibilityPage.tsx
          node scripts/i18n-extract.mjs
      - name: Commit generated values
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/settings/AccessibilityPage.tsx src/lib/i18n/strings.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(i18n): refresh interface strings after catalog disclosure"
          git push origin "HEAD:${{ github.head_ref }}"
