name: Stage 4 Regenerate Once
on:
  push:
    branches: [stage4-reporting-accuracy-impact]
    paths: [".github/workflows/stage4-regenerate-once.yml"]
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          node scripts/i18n-extract.mjs
          pnpm exec prettier --write scripts/audit-judge-flow.mjs scripts/check-docs.mjs
          git diff --stat
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/i18n/strings.json scripts/audit-judge-flow.mjs scripts/check-docs.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate interface strings and format export verification"
            git push origin HEAD:stage4-reporting-accuracy-impact
          fi
      - run: pnpm check:copy && pnpm check:i18n && pnpm docs:check && pnpm lint && pnpm format
      - name: Verify real browser exports
        env:
          VITE_SUPABASE_URL: https://imzdblvljdcbnxtwbmbw.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_ci_only_dummy_key
        run: |
          pnpm build:hosted
          node scripts/audit-judge-flow.mjs
