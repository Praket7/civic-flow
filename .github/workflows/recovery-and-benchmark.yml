name: Isolated recovery and roster benchmark

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery:
    name: Synthetic PostgreSQL backup and restore
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: local-test-only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
      - name: Rehearse restoring a synthetic database
        run: bash scripts/rehearse-local-restore.sh

  roster:
    name: AutoRoster benchmark and first-fit comparison
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/core -> target
      - name: Run reproducible fixtures
        run: |
          set -euo pipefail
          {
            uname -a
            lscpu
            rustc --version
            git rev-parse HEAD
          } > roster-benchmark.txt
          cargo test --locked --manifest-path src-tauri/core/Cargo.toml --test roster_performance -- --nocapture --test-threads=1 2>&1 | tee -a roster-benchmark.txt
          cargo test --locked --manifest-path src-tauri/core/Cargo.toml --test roster_performance compare_optimized_and_first_eligible_baseline -- --ignored --nocapture --test-threads=1 2>&1 | tee -a roster-benchmark.txt
      - uses: actions/upload-artifact@v4
        with:
          name: roster-benchmark
          path: roster-benchmark.txt
          if-no-files-found: error
