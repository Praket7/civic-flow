name: Stage 5 Prepare Once (visual audit)
on:
  push:
    branches: [stage5-visual-interaction-excellence]
    paths: [".github/workflows/stage5-prepare-once.yml"]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          node scripts/i18n-extract.mjs
          pnpm exec prettier --write $(git diff --name-only --diff-filter=ACM 2fde217b4822cf0ca97ff9b67887790e7c55a291 HEAD -- src scripts docs | tr '\n' ' ')
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts docs
          if ! git diff --cached --quiet; then
            git commit -m "Format Stage 5 changes and regenerate interface catalog"
            git push origin HEAD:stage5-visual-interaction-excellence
          fi
      - run: pnpm typecheck && pnpm lint && pnpm format && pnpm check:copy && pnpm check:i18n && pnpm docs:check
      - run: pnpm test -- src/components/ui/Form.test.tsx src/components/ui/Charts.test.tsx src/components/ui/Tabs.test.tsx src/components/help/HelpDialog.test.tsx src/components/help/FirstRunTour.test.tsx src/features/mission-control/MissionControl.test.tsx
      - name: Build and verify real interactions
        env:
          VITE_SUPABASE_URL: https://imzdblvljdcbnxtwbmbw.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_ci_only_dummy_key
        run: |
          pnpm build:hosted
          node scripts/check-judge-build.mjs
          node scripts/audit-judge-flow.mjs
      - name: Capture visual regression evidence
        run: node scripts/audit-zoom.mjs --screenshots stage5-ui --out stage5-ui/viewport-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage5-visual-evidence
          path: stage5-ui/
          if-no-files-found: ignore
