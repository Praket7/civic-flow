name: Stage 6 Prepare Once
on:
  push:
    branches: [stage6-connected-journeys]
    paths: [".github/workflows/stage6-prepare-once.yml"]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          node scripts/i18n-extract.mjs
          pnpm exec prettier --write $(git diff --name-only --diff-filter=ACM b27b1e5bc4bea16d4c1925f90f52f94b6445fcaf HEAD -- src scripts docs | tr '\n' ' ')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts docs
          if ! git diff --cached --quiet; then
            git commit -m "Format Stage 6 journey evidence and interface catalog"
            git push origin HEAD:stage6-connected-journeys
          fi
      - run: pnpm typecheck && pnpm lint && pnpm format && pnpm check:copy && pnpm check:i18n && pnpm docs:check
      - run: pnpm test -- src/lib/workspace/preview/journeys.test.ts src/lib/workspace/repository.test.ts src/lib/workspace/preview/rosterEngine.golden.test.ts src/lib/sync/views.test.ts src/lib/sync/multiDeviceConvergence.test.ts
      - name: Compiled sample journey
        env:
          VITE_SUPABASE_URL: https://imzdblvljdcbnxtwbmbw.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_ci_only_dummy_key
        run: |
          pnpm build:hosted
          node scripts/check-judge-build.mjs
          node scripts/audit-judge-flow.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage6-journey-screenshots
          path: journey-review/
          if-no-files-found: ignore
