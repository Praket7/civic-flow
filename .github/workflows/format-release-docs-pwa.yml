name: One-time release and PWA formatter

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-pwa-formatter-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'hardening/auth-and-release-gates-2026-11-22'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply project formatting
        run: pnpm exec prettier --write docs/RELEASE-CHECKLIST.md README.md .github/workflows/release.yml src/pwa/screens/settings.tsx src/pwa/screens/settings.test.tsx
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/RELEASE-CHECKLIST.md README.md .github/workflows/release.yml src/pwa/screens/settings.tsx src/pwa/screens/settings.test.tsx
          if git diff --cached --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git commit -m "style: format release guide and offline-signout safeguards"
          git push origin "HEAD:${{ github.head_ref }}"
