name: Reminder dispatch

# Keep the scheduler token independent of Supabase's database-wide key.
# JWT verification stays enabled at the Edge Function gateway.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reminder-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch due reminders
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: reminder-production
    env:
      SUPABASE_URL: https://imzdblvljdcbnxtwbmbw.supabase.co
      GATEWAY_ANON_JWT: ${{ secrets.CIVICFLOW_REMINDER_GATEWAY_ANON_JWT }}
      SCHEDULER_TOKEN: ${{ secrets.CIVICFLOW_REMINDER_SCHEDULER_TOKEN }}
    steps:
      - name: Validate scheduler configuration without printing credentials
        run: |
          python3 - <<'PY'
          import base64, json, os, re, sys
          token = os.environ.get("SCHEDULER_TOKEN", "")
          key = os.environ.get("GATEWAY_ANON_JWT", "")
          if not re.fullmatch(r"[A-Za-z0-9_-]{43,128}", token):
              sys.exit("Configure a dedicated high-entropy reminder scheduler token.")
          try:
              parts = key.split(".")
              if len(parts) != 3:
                  raise ValueError()
              role = json.loads(base64.urlsafe_b64decode(parts[1] + "=" * (-len(parts[1]) % 4))).get("role")
              if role != "anon":
                  raise ValueError()
          except Exception:
              sys.exit("Configure the legacy public anon JWT for gateway authentication; never use a service key.")
          PY
      - name: Invoke the dispatcher
        run: |
          response="$(curl --fail --silent --show-error --retry 2 --retry-delay 5 --max-time 100 \
            --request POST "$SUPABASE_URL/functions/v1/dispatch-reminders?limit=25" \
            --header "Authorization: Bearer $GATEWAY_ANON_JWT" \
            --header "apikey: $GATEWAY_ANON_JWT" \
            --header "x-civicflow-scheduler: $SCHEDULER_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{}')"
          printf '%s' "$response" | python3 -c '
          import json, sys
          payload = json.load(sys.stdin)
          names = ("generated", "claimed", "sent", "failed", "skipped", "deferred")
          if any(type(payload.get(name)) is not int or payload[name] < 0 for name in names):
              sys.exit("Invalid dispatcher counter response")
          counts = {name: payload[name] for name in names}
          print("Reminder dispatch:", counts)
          if payload.get("status") != "ok" or counts["failed"] or payload.get("failures") or counts["claimed"] != sum(counts[name] for name in ("sent", "failed", "skipped", "deferred")):
              print("::error title=Reminder delivery requires attention::Review restricted Supabase server-job logs.")
              sys.exit(1)
          '
