name: CI

on:
  push:
    branches: [main, "feat/fbla-stage1-*"]
  pull_request:
    branches: [main, "hardening/auth-and-release-gates-2026-11-22"]

# A new PR commit supersedes its earlier validation run. Keep main-branch
# checks uninterrupted so release evidence remains tied to the exact SHA.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm check:copy
      - run: pnpm check:demo
      - run: pnpm check:i18n
      - run: pnpm check:generated
      - run: pnpm check:hardcodes
      - run: pnpm check:identity
      - run: pnpm check:help
      - run: pnpm docs:check
      - run: pnpm test
      - run: pnpm test:sql
      - run: pnpm test:hosted
      - run: pnpm test:ops
      - run: pnpm build:web
      - name: Enforce entrypoint bundle budgets
        run: node scripts/check-bundle-budget.mjs
      - name: Print audit
        run: node scripts/audit-print.mjs
      - name: Accessibility-tree audit
        run: node scripts/audit-accessibility-tree.mjs
      - name: 200% zoom audit and core screen captures
        run: node scripts/audit-zoom.mjs --screenshots ui-review
      - name: Upload core visual review snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-core-screenshots
          path: ui-review/*.png
          retention-days: 14
          if-no-files-found: ignore
      - name: Contrast audit
        run: node scripts/audit-contrast.mjs
      # The browser deploy must serve the hosted PWA at /, never the local
      # account demo. A non-secret synthetic publishable key is safe in CI.
      - name: Build public hosted PWA (never publish CI credentials)
        env:
          VITE_SUPABASE_URL: https://imzdblvljdcbnxtwbmbw.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_ci_only_dummy_key
        run: |
          pnpm build:hosted
          node scripts/check-judge-build.mjs
          node scripts/audit-judge-flow.mjs
          node -e "const fs = require('node:fs'); const html = fs.readFileSync('dist/index.html','utf8'); if (!html.includes('CivicFlow Volunteer') || !/assets\/pwa-/.test(html)) process.exit(1);"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan the working tree
        run: gitleaks dir . --no-banner --redact --config .gitleaks.toml

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned RustSec auditor
        run: cargo install --locked cargo-audit --version 0.23.0
      - name: Rust advisories (desktop shell)
        run: cargo audit --file src-tauri/Cargo.lock
      - name: Rust advisories (core)
        run: cargo audit --file src-tauri/core/Cargo.lock
      - name: Shipped JavaScript dependencies
        run: pnpm audit --prod --audit-level=high

  native:
    name: Native end-to-end (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri/core -> target
            src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:native:test
      - run: pnpm test:native
      - name: Upload native test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-log
          path: |
            wdio-logs/
          if-no-files-found: ignore

  windows:
    name: Windows desktop compilation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri/core -> target
            src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web
      - name: Check Windows desktop shell and encrypted core
        working-directory: src-tauri
        run: cargo check --locked --target x86_64-pc-windows-msvc

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri/core -> target
            src-tauri -> target
      - name: Format
        working-directory: src-tauri/core
        run: cargo fmt --check
      - name: Clippy
        working-directory: src-tauri/core
        run: cargo clippy --all-targets -- -D warnings
      - name: Core tests
        working-directory: src-tauri/core
        run: cargo test
      - name: AutoRoster medium-scale deterministic benchmark
        working-directory: src-tauri/core
        run: cargo test --test roster_performance medium_roster_performance -- --ignored --nocapture
      - name: AutoRoster same-day reproducibility benchmark
        working-directory: src-tauri/core
        run: cargo test --lib benchmark_realistic_volunteer_and_shift_counts -- --ignored --nocapture
      - name: Build the embedded frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build:web
      - name: Third-party inventory is current
        run: pnpm check:third-party
      - name: Licenses are redistributable
        run: pnpm check:licenses
      - name: Desktop shell compiles
        working-directory: src-tauri
        run: cargo check --locked
      - name: Native hosted-auth boundary tests
        working-directory: src-tauri
        run: cargo test --locked --lib hosted_identity_tests
