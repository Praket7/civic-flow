name: One-time hosted/operations formatting

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: format-hosted-ops-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'hardening/auth-and-release-gates-2026-11-22'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format and regenerate interface index
        run: |
          pnpm exec prettier --write \
            scripts/prepare-hosted-build.mjs scripts/tests/hosted-build.test.mjs \
            scripts/live-hosted-auth-smoke.mjs \
            src/pwa/CoordinatorSchedule.tsx src/pwa/CoordinatorSchedule.test.tsx \
            src/pwa/health.ts src/pwa/health.test.ts src/pwa/coordinator.tsx \
            src/lib/sync/provider.tsx README.md docs/RELEASE-CHECKLIST.md \
            package.json vercel.json .github/workflows/backup-cloud.yml \
            .github/workflows/hosted-auth-smoke.yml .github/workflows/ci.yml
          node scripts/i18n-extract.mjs
      - name: Commit generated formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/prepare-hosted-build.mjs scripts/tests/hosted-build.test.mjs \
            scripts/live-hosted-auth-smoke.mjs \
            src/pwa/CoordinatorSchedule.tsx src/pwa/CoordinatorSchedule.test.tsx \
            src/pwa/health.ts src/pwa/health.test.ts src/pwa/coordinator.tsx \
            src/lib/sync/provider.tsx README.md docs/RELEASE-CHECKLIST.md \
            package.json vercel.json .github/workflows/backup-cloud.yml \
            .github/workflows/hosted-auth-smoke.yml .github/workflows/ci.yml \
            src/lib/i18n/strings.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format hosted release and operations changes"
          git push origin "HEAD:${{ github.head_ref }}"
