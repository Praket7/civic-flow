name: One-time route and operations formatter

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: route-ops-format-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'hardening/auth-and-release-gates-2026-11-22'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format latest code and regenerate i18n
        run: |
          pnpm exec prettier --write src/app/router.tsx src/app/accessibility.test.tsx src/pwa/PwaApp.tsx src/pwa/PwaApp.test.tsx src/lib/auth/hosted.ts supabase/functions/dispatch-reminders/index.ts .github/workflows/reminders.yml scripts/check-docs.mjs
          node scripts/i18n-extract.mjs
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/router.tsx src/app/accessibility.test.tsx src/pwa/PwaApp.tsx src/pwa/PwaApp.test.tsx src/lib/auth/hosted.ts supabase/functions/dispatch-reminders/index.ts .github/workflows/reminders.yml scripts/check-docs.mjs src/lib/i18n/strings.json
          if git diff --cached --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git commit -m "chore: format deferred routes and operations hardening"
          git push origin "HEAD:${{ github.head_ref }}"
