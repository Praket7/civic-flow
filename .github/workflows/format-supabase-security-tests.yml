name: Temporary Supabase test formatter

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: supabase-security-prettier-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'hardening/auth-and-release-gates-2026-11-22'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format only new Supabase security tests
        run: pnpm exec prettier --write supabase/tests/permissions.test.mjs supabase/tests/reminders.test.mjs
      - name: Commit deterministic formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/tests/permissions.test.mjs supabase/tests/reminders.test.mjs
          if git diff --cached --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git commit -m "style(test): format Supabase RLS and notification authorization regressions"
          git push origin "HEAD:${{ github.head_ref }}"
