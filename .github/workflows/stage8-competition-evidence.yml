name: Stage 8 competition evidence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    name: Competition evidence freeze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri/core -> target
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/tests/competition-evidence.test.mjs
      - name: Prepare evidence and record toolchain
        run: |
          mkdir -p competition-evidence
          {
            git rev-parse HEAD
            node --version
            pnpm --version
            rustc --version
            uname -a
            lscpu
            google-chrome --version
          } > competition-evidence/toolchain.txt
      - name: Known-answer reports
        run: |
          set -o pipefail
          pnpm test -- src/lib/workspace/preview/reports.test.ts src/features/reports/CustomReportPage.test.ts 2>&1 | tee competition-evidence/known-answer.txt
          cargo test --locked --manifest-path src-tauri/core/Cargo.toml --test reports 2>&1 | tee -a competition-evidence/known-answer.txt
      - name: Reproduce optimizer benchmarks with recorded hardware
        run: |
          set -o pipefail
          cargo test --locked --manifest-path src-tauri/core/Cargo.toml --test roster_performance -- --ignored --nocapture 2>&1 | tee competition-evidence/benchmark.txt
      - name: Build isolated judging workspace
        env:
          VITE_SUPABASE_URL: https://imzdblvljdcbnxtwbmbw.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_ci_only_dummy_key
        run: |
          pnpm build:hosted
          node scripts/check-judge-build.mjs
      - name: Run full local browser journey without external network
        env:
          CIVICFLOW_COMPETITION_EVIDENCE: "1"
        run: |
          set -o pipefail
          node scripts/audit-judge-flow.mjs 2>&1 | tee competition-evidence/browser-journey.txt
          cp journey-review/*.png competition-evidence/
      - name: Verify rendered PDF and hash all evidence
        run: node scripts/competition-evidence.mjs
      - name: Archive frozen evidence
        uses: actions/upload-artifact@v4
        with:
          name: competition-evidence-${{ env.EXPECTED_SOURCE_SHA }}
          path: competition-evidence/
          if-no-files-found: error
          retention-days: 90
