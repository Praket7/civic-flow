name: One-time browser-demo copy refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: web-demo-copy-refresh-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'hardening/auth-and-release-gates-2026-11-22'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format modified UI, tests and docs
        run: |
          pnpm exec prettier --write src/features/public/LaunchPage.tsx src/features/public/LaunchPage.module.css src/features/public/WelcomePage.tsx src/features/public/SignInPage.tsx src/features/public/SignUpPage.tsx src/lib/workspace/previewRepository.ts src/lib/workspace/repository.test.ts README.md docs/RELEASE-CHECKLIST.md docs/FOUNDATION-BASELINE.md
      - name: Regenerate interface string inventory
        run: node scripts/i18n-extract.mjs
      - name: Commit generated inventory and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/public/LaunchPage.tsx src/features/public/LaunchPage.module.css src/features/public/WelcomePage.tsx src/features/public/SignInPage.tsx src/features/public/SignUpPage.tsx src/lib/workspace/previewRepository.ts src/lib/workspace/repository.test.ts src/lib/i18n/strings.json README.md docs/RELEASE-CHECKLIST.md docs/FOUNDATION-BASELINE.md
          if git diff --cached --quiet; then
            echo "Already generated and formatted"
            exit 0
          fi
          git commit -m "chore(web): format demo gate and regenerate interface string inventory"
          git push origin "HEAD:${{ github.head_ref }}"
