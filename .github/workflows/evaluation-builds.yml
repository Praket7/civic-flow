name: Evaluation installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/evaluation-builds.yml"

permissions:
  contents: read

concurrency:
  group: evaluation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    name: Build evaluation installer (${{ matrix.os }})
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: dmg
            artifact: evaluation-macos
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: nsis,msi
            artifact: evaluation-windows

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri/core -> target
            src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Verify dependency inventory on this platform
        if: matrix.os == 'macos-latest'
        run: pnpm check:third-party
      - name: Validate version and local demo
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          node scripts/check-release-version.mjs "v$version"
          pnpm check:demo
          pnpm test:hosted
      - name: Build evaluation installer
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Verify universal app and Finder-independent packaging
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          bash scripts/package-macos-evaluation.sh
          rm -- src-tauri/target/universal-apple-darwin/release/bundle/dmg/*_evaluation.dmg
      - name: Collect installers and verify expected formats
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evaluation
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          if [ "${{ matrix.os }}" = macos-latest ]; then
            cp "$bundle"/dmg/*.dmg evaluation/
            for file in evaluation/*.dmg; do hdiutil verify "$file"; done
          else
            cp "$bundle"/nsis/*.exe evaluation/
            cp "$bundle"/msi/*.msi evaluation/
          fi
          for file in evaluation/*; do test -s "$file"; done
          printf 'commit=%s\nplatform=%s\nstatus=EVALUATION_NOT_PRODUCTION_SIGNED\n' \
            "$GITHUB_SHA" "${{ matrix.os }}" > "evaluation/${{ matrix.artifact }}-BUILD-INFO.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: evaluation/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish checked evaluation prerelease
    needs: evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require successful CI for this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            result="$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --branch main --event push --limit 1 --json status,conclusion --jq '.[0] | [.status,.conclusion] | @tsv')"
            if [ "$result" = $'completed\tsuccess' ]; then exit 0; fi
            if [[ "$result" == completed$'\t'* ]]; then
              echo "CI did not pass: $result"
              exit 1
            fi
            sleep 30
          done
          echo "CI did not finish within the verification window."
          exit 1
      - uses: actions/download-artifact@v4
        with:
          pattern: evaluation-*
          path: evaluation
          merge-multiple: true
      - name: Verify package inventory and write checksums
        working-directory: evaluation
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -name '*.dmg' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name '*.exe' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name '*.msi' | wc -l)" -eq 1
          sha256sum -- *.dmg *.exe *.msi *-BUILD-INFO.txt > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Attest installer provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: evaluation/*
      - name: Publish evaluation only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          tag="evaluation-$version-${GITHUB_SHA:0:12}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Evaluation release already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "$tag" evaluation/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "CivicFlow $version evaluation" \
            --notes "Evaluation builds from commit $GITHUB_SHA. The macOS DMG is ad-hoc signed, not notarized; Windows installers are unsigned. Intended for testing with fictional data, not production enrollment. No signed updater feed is provided. Verify SHA256SUMS.txt and GitHub provenance. Do not bypass operating-system security warnings for untrusted downloads."
